name: Behavior Bug or Plugin Incompatibility
description: Report issues with plugin incompatbility or other behavior related issues.
labels: [ "status: needs triage", "type: bug" ]
body:
  - type: textarea
    attributes:
      label: Expected behavior
      description: What you expected to see.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Observed/Actual behavior
      description: What you actually saw.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps/models to reproduce
      description: This may include a build schematic, a video, or detailed instructions to help reconstruct the issue.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Plugin and Datapack List
      description: |
        All plugins and datapacks running on your server.
        To list plugins, run `/plugins`. For datapacks, run `/datapack list`.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Configuration files
      description: |
        All server configuration files, such as sewlia.yml, etc.
        , which helps us troubleshoot problems faster.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Sewlia version
      description: |
        Run `/version` on your server and **paste** the full, unmodified output here.
        "latest" is *not* a version; we require the output of `/version` so we can adequately track down the issue.
        Additionally, do NOT provide a screenshot, you MUST paste the entire output.
        <details>
        <summary>Example</summary>

        ```
        > version
        [09:48:51 INFO]: Checking version, please wait...
        [09:48:52 INFO]: This server is running Sewlia version 1.21.1-DEV-dev/1.21.1@fc8ccbb (2024-11-11T06:29:22Z) (Implementing API version 1.21.1-R0.1-SNAPSHOT)
        You are 6 version(s) behind
        Download the new version at: https://tranic.one/downloads/sewlia
        Previous version: 1.21.1-DEV-770e4b8 (MC: 1.21.1)
        ```

        </details>
    validations:
      required: true

  - type: textarea
    attributes:
      label: Other
      description: |
        Please include other helpful information below.
        The more information we receive, the quicker and more effective we can be at finding the solution to the issue.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Before submitting this issue, please ensure the following:

        1. You are running the latest version of Sewlia from [our downloads page](https://tranic.one/downloads/sewlia).
        2. You searched for and ensured there isn't already an open issue regarding this.
        3. Your version of Minecraft is supported by Sewlia.